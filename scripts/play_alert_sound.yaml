play_alert_sound:
  fields:
    sound_file: {}
  sequence:
    - condition: time
      before: "8:00:00"
      after: "10:00:00"
    - action: media_player.volume_set
      data:
        entity_id: group.all_googlehomes
        volume_level: 0.01
    - action: media_player.turn_off
      data:
        entity_id: group.all_googlehomes
    - delay: 00:00:01
    - action: media_player.turn_on
      data:
        entity_id: group.all_googlehomes
    - delay: 00:00:01
    - action: media_player.play_media
      data:
        entity_id: group.all_googlehomes
        media_content_id: "http://192.168.0.240:8123/local/mp3/{{ sound_file }}"
        media_content_type: audio/mp3
    - delay: 00:00:01
    - action: media_player.volume_set
      data:
        entity_id: group.all_googlehomes
        volume_level: 0.7