# Daily Reminder to take medicine
- id: medicine_reminder
  alias: Take Medicine
  initial_state: on
  triggers:
    - trigger: time
      at: "08:30:00"
    - trigger: time
      at: "20:00:00"
  actions:
    - action: script.telegram_reminder
      data:
        message: "Did you take your medicine?"
        yes_command: "/medoff"
        later_command: "/medlater"
        ack_yes_message: "Ok, Medicine Reminder acknowledged."
        ack_later_message: "Ok, I'll remind you again in 30 minutes."
        repeat_interval: "00:30:00"