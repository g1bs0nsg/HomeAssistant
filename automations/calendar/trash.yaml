# Triggers on google calendar event to put trash out
- id: trash_put_out
  alias: Put out the trash
  initial_state: on
  trigger:
    - trigger: calendar
      entity_id: calendar.trefynwed_gmail_com
      event: start
  condition:
    - condition: template
      value_template: "{{ 'Put out the trash' in trigger.calendar_event.summary }}"
  actions:
    - action: script.telegram_reminder
      data:
        message: "Did you put out the trash?"
        yes_command: "/trashoff"
        later_command: "/trashlater"
        ack_yes_message: "Ok, trash reminder acknowledged."
        ack_later_message: "Ok, I'll remind you again in 30 minutes."
        repeat_interval: "00:30:00"
