# Triggers on google calendar event to change HVAC filter
- id: hvac_filter_change
  alias: Change HVAC Filter
  initial_state: on
  trigger:
    - trigger: calendar
      entity_id: calendar.trefynwed_gmail_com
      event: start
  condition:
    - condition: template
      value_template: "{{ 'Change HVAC Filter' in trigger.calendar_event.summary }}"
  actions:
    - action: script.telegram_reminder
      data:
        message: "Have you changed the HVAC filter?"
        yes_command: "/hvacoff"
        later_command: "/hvaclater"
        ack_yes_message: "Ok, HVAC filter changed."
        ack_later_message: "Ok, I'll remind you again in 1 hour."
        repeat_interval: "01:00:00"
