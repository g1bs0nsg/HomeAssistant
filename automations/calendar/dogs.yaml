# Triggers on google calendar event to give dogs medicine
- id: dogs_give_heatworm_flea_tick
  alias: Dogs - Give Heartworm/Flea/Tick
  initial_state: on
  trigger:
    - trigger: calendar
      entity_id: calendar.trefynwed_gmail_com
      event: start
  condition:
    - condition: template
      value_template: "{{ 'Dogs - Flea/Tick/Heartworm' in trigger.calendar_event.summary }}"
  actions:
    - action: script.telegram_reminder
      data:
        message: "Did you give the dogs their medicine?"
        yes_command: "/dogsoff"
        later_command: "/dogslater"
        ack_yes_message: "Ok, Dog reminder acknowledged"
        ack_later_message: "Ok, I will remind you again in 30 minutes."
        repeat_interval: "00:30:00"
