- id: 3dprinter_done
  alias: 3D Print Done
  initial_state: on
  trigger:
    device_id: !secret blp2s
    domain: bambu_lab
    type: event_print_finished
    trigger: device
  action:
    - action: !secret telservice
      data:
        message: "3D Print Complete!"

- id: 3dprinter_error
  alias: 3D Printer Error
  initial_state: on
  trigger:
    device_id: !secret blp2s
    domain: bambu_lab
    type: event_print_error
    trigger: device
  action:
    - action: !secret telservice
      data:
        message: "3D Printer has experienced an error and requires your attention!"

- id: 3dprinter_failed
  alias: 3D Printer Failed
  initial_state: on
  trigger:
    device_id: !secret blp2s
    domain: bambu_lab
    type: event_print_failed
    trigger: device
  action:
    - action: !secret telservice
      data:
        message: "3D Print has failed!"
