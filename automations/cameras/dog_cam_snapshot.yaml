- id: dog_cam_snapshot
  alias: Dog Camera Snapshot
  initial_state: on
  use_blueprint:
    path: personal/security/frigate_snapshots.yaml
    input:
      frigate_trigger_id: frigate-event-dogcam
      camera_id: dog_cam
      watched_zones: ["dcperson", "fpoverhead"]
      notify_chat_id: !secret tchatid1
      frigate_base_url: !secret ha_base_url
      sound_file: "motion_alert.mp3"
      presence_conditions:
        - condition: state
          entity_id: input_boolean.motion_alert
          state: "on"
        - condition: state
          entity_id: input_boolean.guest
          state: "off"
        - condition: state
          entity_id: group.presence
          state: "not_home"
      trigger_motion_alert_script: false