- id: doorbird_snapshot
  alias: Doorbird Camera Snapshot
  initial_state: off
  use_blueprint:
    path: personal/security/frigate_snapshots.yaml
    input:
      frigate_trigger_id: frigate-event-doorbird
      camera_id: front_door
      watched_zones: ["dbperson", "fpoverhead"]
      notify_chat_id: !secret tchatid1
      frigate_base_url: !secret ha_base_url
      sound_file: "motion_alert.mp3"
      presence_conditions:
        - condition: state
          entity_id: input_boolean.motion_alert
          state: "on"
        - condition: state
          entity_id: input_boolean.autolock
          state: "on"
        - condition: state
          entity_id: binary_sensor.front_door
          state: "off"
        - condition: template
          value_template: "{{ not (now() - states.binary_sensor.front_door.last_changed).total_seconds() < 30 }}"
      trigger_motion_alert_script: true