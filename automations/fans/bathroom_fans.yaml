# Turn off bathroom vent fans automatically

- id: Bath_Fans
  initial_state: on
  alias: Bathroom Fans - Auto off
  triggers:
    - trigger: state
      entity_id: switch.hallway_bath_fan
      from: "off"
      to: "on"
      for: "02:00:00"
    - trigger: state
      entity_id: switch.basement_bath_fan
      from: "off"
      to: "on"
      for: "01:00:00"
  actions:
    - action: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
