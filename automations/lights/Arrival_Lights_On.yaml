# Turn on the lights if state changes from not_home to home
# and it's after dark.

- id: Arrival_Lights_On
  initial_state: on
  alias: Lights On - Arriving Home
  trigger:
    trigger: state
    entity_id: group.presence
    from: "not_home"
    to: "home"
  condition:
    condition: state
    entity_id: sun.sun
    state: "below_horizon"
  actions:
    - action: light.turn_on
      entity_id:
        - light.livingroom_lights
      data:
        brightness_pct: 100
    - delay: "00:05:00"
    - action: light.turn_on
      entity_id: light.livingroom_lights
      data:
        brightness_pct: 10
