# Turn on the living room lights at sunset
# in nightlight mode

- id: Interior_Lights_On_Sunset
  alias: Interior Lights On - Sunset
  initial_state: off
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:45:00"
    - trigger: state
      entity_id: group.presence
      to: "home"
  condition:
    condition: and
    conditions:
      - condition: sun
        after: sunset
        after_offset: "-00:45:00"
      - condition: state
        entity_id: group.presence
        state: "home"
      - condition: state
        entity_id: input_boolean.guest
        state: "off"
  action:
    action: light.turn_on
    target:
      entity_id: light.livingroom_lights
    data:
      effect: Night light
